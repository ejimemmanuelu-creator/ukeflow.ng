.link{border:0;background:none;color:var(--green);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:10px 0;margin-top:6px}

var NAV=[["home","Home","home"],["pay","Pay","pay"],["receive","Receive","receive"],["rewards","Rewards","gift"],["activity","Activity","clock"]];
function buildNav(){$("#nb").innerHTML=NAV.map(function(n){return '<button data-v="'+n[0]+'"'+(n[0]==="receive"?' class="mid"':'')+'>'+ic(n[2],22)+'<span>'+n[1]+'</span></button>'}).join("")}

function logoMark(h,solid){var id="lg"+(LG++);return '<svg height="'+h+'" width="'+Math.round(h*1.339)+'" viewBox="0 0 1000 747" role="img" aria-label="ukeflow"><defs><linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="747"><stop offset="0" stop-color="#D94B4B"/><stop offset=".5" stop-color="#E57A3F"/><stop offset="1" stop-color="#F5B82E"/></linearGradient></defs><g fill="'+(solid||'url(#'+id+')')+'"><polygon points="120.1,532.2 254.4,746.6 745.3,746.6 879.5,532.5 765.2,332.9 638.6,537.7 361.1,537.7 234.4,332.9"/><polygon points="579.3,0 766.6,332.9 1000,332.9 812.7,0"/><polygon points="420.7,0 187.3,0 0,332.9 233.4,332.9"/></g></svg>'}
var PWK="ukeflow_pw",MEM={},unlocked=false,hiddenAt=0,fails=0,lockUntil=0;
function sget(k){try{return localStorage.getItem(k)}catch(e){return MEM[k]||null}}
function sset(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){if(v===null)delete MEM[k];else MEM[k]=v}}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function rnd(){var a=new Uint8Array(12);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<12;i++)a[i]=Math.floor(Math.random()*256);return hex(a)}
function hashPw(pw,salt){
  var enc=new TextEncoder();
  if(window.crypto&&crypto.subtle){return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]).then(function(k){return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(salt),iterations:150000},k,256)}).then(hex)}
  var h=5381,t=salt+pw;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return Promise.resolve("x"+h);
}
function gate(){
  var c=!sget(PWK),g=$("#gate");g.hidden=false;
  g.innerHTML='<div class="gbox">'+logoMark(34)+'<span class="wm" style="margin-left:10px;vertical-align:middle">ukeflow</span>'+
  '<h1>'+(c?"Create your password":"Welcome back")+'</h1><p>'+(c?"You will use it each time you open the app.":"Enter your password to open your wallet.")+'</p>'+
  '<label for="g_pw">Password</label><div class="pwrow"><input id="g_pw" type="password" autocomplete="'+(c?"new-password":"current-password")+'" placeholder="'+(c?"At least 8 characters":"Your password")+'" onkeydown="if(event.key===\'Enter\')gSubmit()"><button type="button" aria-label="Show or hide password" onclick="toggleSee()">'+ic("eye",20)+'</button></div>'+
  (c?'<label for="g_pw2">Confirm password</label><input id="g_pw2" type="password" autocomplete="new-password" placeholder="Type it again" onkeydown="if(event.key===\'Enter\')gSubmit()">':'')+
  '<div class="msg err" id="g_err" role="alert"></div><button class="btn" onclick="gSubmit()">'+(c?"Create password":"Log in")+'</button>'+
  (c?'':'<button class="link" onclick="forgot()">Forgot password?</button>')+
  '<p class="gfoot">Prototype: your password is saved on this device only, as a secure hash. A live app checks it on the server.</p></div>';
  var f=$("#g_pw");if(f&&f.focus)f.focus();
}
function toggleSee(){var a=$("#g_pw"),t=a.type==="password";a.type=t?"text":"password";var b=$("#g_pw2");if(b)b.type=a.type}
function gSubmit(){
  var c=!sget(PWK),pw=$("#g_pw").value,err=function(t){$("#g_err").textContent=t};
  if(c){
    if(pw.length<8)return err("Use at least 8 characters.");
    if(pw!==$("#g_pw2").value)return err("The passwords do not match.");
    var salt=rnd();return hashPw(pw,salt).then(function(h){sset(PWK,salt+":"+h);unlock()});
  }
  if(Date.now()<lockUntil)return err("Too many attempts. Try again in "+Math.ceil((lockUntil-Date.now())/1000)+" seconds.");
  if(!pw)return err("Enter your password.");
  var rec=sget(PWK).split(":");
  return hashPw(pw,rec[0]).then(function(h){
    if(h===rec[1]){fails=0;unlock();return}
    fails++;
    if(fails>=5){fails=0;lockUntil=Date.now()+30000;err("Too many attempts. Try again in 30 seconds.")}
    else err("Wrong password. "+(5-fails)+" attempt"+(5-fails===1?"":"s")+" left.");
  });
}
function forgot(){if(window.confirm("Reset your password? This clears the prototype password saved on this device.")){sset(PWK,null);gate()}}
function unlock(){unlocked=true;document.body.classList.remove("locked");var g=$("#gate");g.hidden=true;g.innerHTML="";go("home")}
function lock(){unlocked=false;document.body.classList.add("locked");gate()}
function splash(){var sp=$("#splash");setTimeout(function(){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#050505");lock()},2600);setTimeout(function(){sp.classList.add("out")},2700);setTimeout(function(){sp.hidden=true},3400)}
document.addEventListener("visibilitychange",function(){if(document.hidden)hiddenAt=Date.now();else if(unlocked&&hiddenAt&&Date.now()-hiddenAt>60000)lock()});

function pay(){return '<h2>Pay &amp; send</h2><p>Balance: <b style="color:var(--ink)">'+fmt(S.bal)+'</b>. Earn 1 point for every ₦100 you spend.</p>'+tiles()+'<p style="margin-top:14px"><small>Demo: a live app delivers these through licensed bill-payment and payment partners.</small></p>'}
function form(){

function fail(m){S.err=m;var e=$("#err");if(e)e.textContent=m;return false}
function submitForm(){

function spend(t,sub,amt,token,rows){
  if(amt>S.bal)return fail("Your wallet balance is too low. Tap Receive to top up.");

function rewards(){
